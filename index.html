/* Derived state helpers                                               */
/* ------------------------------------------------------------------ */

const COLUMN_RANK = { now: 0, next: 1, later: 2 };

function missingRolesFor(epic, capacity) {
  return epic.roles.filter((r) => !capacity[r] || capacity[r] < 1);
}

// A dependency is "blocking" when the dependency sits in a later column
// than the epic that needs it.
function blockingDepsFor(epic, byId) {
  return epic.deps
    .map((id) => byId[id])
    .filter(Boolean)
    .filter((dep) => COLUMN_RANK[dep.column] > COLUMN_RANK[epic.column]);
}

// Order within a column is the array order, so a move is: pull the epic out,
// splice it back in at `index` among that column's remaining epics, then
// re-flatten grouped by column. Cross-column order is meaningless here —
// every consumer filters by column first.
function moveEpic(epics, id, toColumn, index) {
  const moving = epics.find((e) => e.id === id);
  if (!moving) return epics;

  const byCol = { now: [], next: [], later: [] };
  epics.forEach((e) => { if (e.id !== id) byCol[e.column].push(e); });

  const target = byCol[toColumn];
  const at = Math.max(0, Math.min(index, target.length));
  target.splice(at, 0, moving.column === toColumn ? moving : { ...moving, column: toColumn });

  return [...byCol.now, ...byCol.next, ...byCol.later];
}

function nextEpicId(epics) {
  let max = 0;
  epics.forEach((e) => {
    const m = /^E(\d+)$/.exec(e.id);
    if (m) max = Math.max(max, parseInt(m[1], 10));
  });
  return "E" + (max + 1);
}

// The bullet fields (scope, out-of-scope, acceptance) round-trip through a
// plain textarea as one item per line.
function linesToList(text) {
  return text.split("\n").map((s) => s.trim()).filter(Boolean);
}

function listToLines(list) {
  return (list || []).join("\n");
}

// Everything `id` depends on, directly or transitively — its full
// dependency closure.
function transitiveDepIds(byId, id) {
  const seen = new Set();
  const epic = byId[id];
  const stack = epic ? [...epic.deps] : [];
  while (stack.length) {
    const cur = stack.pop();
    if (seen.has(cur)) continue;
    seen.add(cur);
    const e = byId[cur];
    if (e) stack.push(...e.deps);
  }
  return seen;
}

// Adding `candidateId` as a dependency of `epicId` closes a loop exactly
// when `candidateId` already (transitively) depends on `epicId`.
function wouldCreateCycle(byId, epicId, candidateId) {
  return transitiveDepIds(byId, candidateId).has(epicId);
}

function dependentsOf(epics, id) {
  return epics.filter((e) => e.id !== id && e.deps.includes(id));
}

  return (

// Confidence reads as border treatment, not a badge: color steps down from
// High to Medium, and Low switches to a dashed style on top of that.
const CONFIDENCE_BORDER = {
  High:   { style: "solid",  color: "border-slate-300" },
  Medium: { style: "solid",  color: "border-slate-200" },
  Low:    { style: "dashed", color: "border-slate-200" },
};

const VALUE_BADGE_STYLE = {
  High:   "bg-accent/10 text-accent",
  Medium: "bg-slate-100 text-slate-600",
  Low:    "bg-slate-50 text-slate-400",
};

function ValueBadge({ value }) {
  if (!value) return null;
  return (
    <span
      className={
        "shrink-0 rounded px-1.5 py-0.5 text-[10px] font-semibold uppercase tracking-wide " +
        (VALUE_BADGE_STYLE[value] || VALUE_BADGE_STYLE.Medium)
      }
    >
      {value}
    </span>
  );
}

function Card({ epic, capacity, byId, onOpen, onDragStart, onDragEnd, dragging, hidden, registerNode, selected, ringClass, dimLevel }) {
  const missing = missingRolesFor(epic, capacity);
  const blocked = blockingDepsFor(epic, byId);
  // In Later, the gate is external rather than effort — show the reason
  // in place of an estimate.
  const showBlockedBy = epic.column === "later" && epic.blockedBy;

  // Unwarned cards still get a left bar — neutral rather than transparent —
  // so every card reads as a complete shape; the bar only changes color to
  // signal a state.
  let borderClass = "border-l-4 border-l-slate-200";
  if (missing.length) borderClass = "border-l-4 border-l-red-500";
  else if (blocked.length) borderClass = "border-l-4 border-l-amber-500";

  const conf = CONFIDENCE_BORDER[epic.confidence] || CONFIDENCE_BORDER.High;

  return (
    <article
      ref={(node) => registerNode(epic.id, node)}
      data-card-id={epic.id}
      style={{
        // Lifted out of layout, but deliberately still mounted: it stays the
        // drag source, so `dragend` still fires on it if the drag is cancelled.
        display: hidden ? "none" : undefined,
        // Tailwind's border-style utilities aren't directional, so confidence's
        // dashed/solid treatment is set here rather than via className — left
        // pinned to solid regardless, so the warning bar is never affected.
        borderTopStyle: conf.style,
        borderRightStyle: conf.style,
        borderBottomStyle: conf.style,
        borderLeftStyle: "solid",
      }}
      draggable
      onDragStart={(e) => onDragStart(e, epic.id)}
      onDragEnd={onDragEnd}
      onClick={() => onOpen(epic.id)}
      className={
        "card cursor-pointer select-none rounded-lg border bg-white p-3.5 " +
        (selected ? "border-accent" : conf.color) + " " +
        (selected
          ? "shadow-[0_6px_16px_rgba(16,24,40,0.12)]"
          : "shadow-[0_1px_2px_rgba(16,24,40,0.04)] hover:shadow-[0_2px_8px_rgba(16,24,40,0.08)]") + " " +
        borderClass + " " +
        (ringClass ? "ring-2 " + ringClass : "") + " " +
        (dragging ? "card-drag" : dimLevel === "50" ? "opacity-50" : dimLevel === "35" ? "opacity-[0.35]" : "")
      }
    >
      <div className="flex items-start justify-between gap-3">
        <h3 className={
          "text-[15px] font-medium leading-snug " +
          (epic.title ? "text-slate-900" : "italic text-slate-400")
        }>
          {epic.title || "Untitled epic"}
        </h3>
        <div className="flex shrink-0 items-center gap-1.5">
          <ValueBadge value={epic.value} />
          <span className="shrink-0 rounded bg-slate-50 px-1.5 py-0.5 font-mono text-[11px] text-slate-500">
            {epic.id}
          </span>
        </div>
      </div>

      {epic.outcome && (
        <p className="mt-1 text-[12px] leading-snug text-slate-400">{epic.outcome}</p>
      )}

      <div className="mt-2.5 flex flex-wrap items-center gap-1.5">
        {epic.roles.map((r) => (
          <RoleTag key={r} role={r} muted={missing.includes(r)} />
        ))}
        {!showBlockedBy && epic.estimate != null && (
          <span className="text-[12px] text-slate-400">
            &middot; {epic.estimate}w
          </span>
        )}
      </div>

      {showBlockedBy && (
        <div className="mt-2.5">
          <span className="inline-flex items-center rounded bg-slate-50 px-2 py-1 text-[11.5px] leading-snug text-slate-500">
            Blocked: {epic.blockedBy}
          </span>
        </div>
      )}

      {epic.deps.length > 0 && (
        <div className="mt-2 font-mono text-[11px] text-slate-400">
          deps: {epic.deps.join(", ")}
        </div>
      )}

      {(missing.length > 0 || blocked.length > 0) && (
        <div className="mt-2.5 flex flex-wrap gap-1.5">
          {missing.length > 0 && (
            <Badge tone="red">
              no {missing.join(" / ")} {missing.length > 1 ? "roles" : "engineer"}
            </Badge>
          )}
          {blocked.map((dep) => (
            <Badge key={dep.id} tone="amber">
              depends on {dep.id} (in {COLUMN_LABEL[dep.column]})
            </Badge>
          ))}
        </div>
      )}
    </article>
  );
}

function CapacityReadout({ epics, capacity }) {
  const perRole = ROLES.map((role) => {
    const weeks = epics
      .filter((e) => e.roles.includes(role))
      .reduce((sum, e) => sum + (e.estimate || 0), 0);
    const off = !capacity[role];
    const available = capacity[role] * CAPACITY_WEEKS;
    // A disabled role is already flagged elsewhere (red, "no X engineer") —
    // over-capacity is a distinct, milder signal that only applies once a
    // role actually has someone assigned to it.
    const over = !off && weeks > available;
    return { role, weeks, off, available, over };
  }).filter((r) => r.weeks > 0);

  if (!perRole.length) {
    return (
      <div className="mt-3 text-[12px] text-slate-300">
        {epics.length ? "Not estimated" : "No load"}
      </div>
    );
  }

  const max = Math.max(...perRole.map((r) => Math.max(r.weeks, r.available)), 1);
  const overRoles = perRole.filter((r) => r.over).map((r) => r.role);

  return (
    <div className="mt-3 space-y-1.5">
      {perRole.map(({ role, weeks, off, available, over }) => (
        <div key={role} className="flex items-center gap-2">
          <span className="w-12 shrink-0 text-[11px] font-medium text-slate-500">
            {role}
          </span>
          <span className="h-1.5 flex-1 overflow-hidden rounded-full bg-slate-100">
            <span
              className={
                "block h-full rounded-full " +
                (off ? "bg-red-400" : over ? "bg-amber-400" : "bg-accent")
              }
              style={{ width: Math.min(100, (weeks / max) * 100) + "%" }}
            />
          </span>
          <span
            className={
              "shrink-0 text-right text-[11px] tabular-nums " +
              (off ? "text-red-600" : over ? "text-amber-700" : "text-slate-500")
            }
          >
            {over ? weeks + "w / " + available + "w" : weeks + "w"}
          </span>
        </div>
      ))}
      {overRoles.length > 0 && (
        <p className="pt-0.5 text-[11px] font-medium text-amber-700">
          Over capacity: {overRoles.join(", ")}
        </p>
      )}
    </div>
  );
}

// The grey slot showing where the card will land. Sized to the lifted card so
// the gap that opens is exactly the space it will occupy.
function DropSlot({ height }) {
  return (
    <div
      className="drop-slot rounded-lg border border-dashed border-slate-300 bg-slate-100/70"
      style={{ height: height || 96 }}
    />
  );
}

function Column({
  col, epics, capacity, byId, onOpen, registerNode, onAddEpic, openId, filter,
  drag, dropAt, onHover, onLeave, onDrop, onDragStart, onDragEnd,
}) {
  const listRef = useRef(null);
  const totalWeeks = epics.reduce((s, e) => s + (e.estimate || 0), 0);

  // The lifted card leaves the flow entirely — the placeholder stands in for it.
  const visible = drag && drag.lifted
    ? epics.filter((e) => e.id !== drag.id)
    : epics;

  const phIndex = dropAt && dropAt.column === col.id ? dropAt.index : null;
  const over = phIndex !== null;

  // Insertion point = first card whose midpoint sits below the pointer.
  const indexFromPointer = (clientY) => {
    const nodes = listRef.current
      ? [...listRef.current.querySelectorAll("[data-card-id]")]
          .filter((n) => !drag || n.dataset.cardId !== drag.id)
      : [];
    for (let i = 0; i < nodes.length; i++) {
      const r = nodes[i].getBoundingClientRect();
      if (clientY < r.top + r.height / 2) return i;
    }
    return nodes.length;
  };

  const handleDragOver = (e) => {
    if (!drag) return;
    e.preventDefault();
    e.dataTransfer.dropEffect = "move";
    onHover(col.id, indexFromPointer(e.clientY));
  };

  // Priority when both are active: an open panel always wins the board's
  // visual attention — the active filter just stays armed underneath, and
  // reappears once the panel closes (its own state is untouched by this).
  const cardVisual = (epic) => {
    if (openId != null) {
      return openId === epic.id
        ? { selected: true }
        : { dimLevel: "50" };
    }
    if (filter) {
      return filter.ids.has(epic.id)
        ? { ringClass: filter.ringClass }
        : { dimLevel: "35" };
    }
    return {};
  };

  const card = (epic, isHidden) => (
    <Card
      key={epic.id}
      epic={epic}
      capacity={capacity}
      byId={byId}
      onOpen={onOpen}
      registerNode={registerNode}
      dragging={drag && drag.id === epic.id}
      hidden={isHidden}
      {...cardVisual(epic)}
      onDragStart={onDragStart}
      onDragEnd={onDragEnd}
    />
  );

  // One flat keyed list, so the lifted card keeps its identity when it moves to
  // the tail — remounting it mid-drag would kill the drag.
  const renderList = () => {
    const out = [];
    const slot = <DropSlot key="__slot" height={drag && drag.height} />;
    visible.forEach((e, i) => {
      if (phIndex === i) out.push(slot);
      out.push(card(e, false));
    });
    if (phIndex === visible.length) out.push(slot);
    if (drag && drag.lifted) {
      const lifted = epics.find((e) => e.id === drag.id);
      if (lifted) out.push(card(lifted, true));
    }
    return out;
  };

  return (
    <section
      onDragOver={handleDragOver}
      // dragleave also fires when the pointer crosses onto a child card, which
      // strobes the highlight. Only clear once the pointer truly exits.
      onDragLeave={(e) => {
        if (!e.currentTarget.contains(e.relatedTarget)) onLeave(col.id);
      }}
      onDrop={(e) => { e.preventDefault(); onDrop(col.id, indexFromPointer(e.clientY)); }}
      className={
        "flex min-h-0 flex-col rounded-xl border bg-white transition-colors duration-150 " +
        (over ? "col-over border-accent/40" : "border-slate-200")
      }
    >
      <header className="border-b border-slate-100 px-4 pb-3 pt-4">
        <div className="flex items-baseline justify-between gap-3">
          <h2 className="text-[13px] font-semibold uppercase tracking-[0.08em] text-slate-700">
            {col.label}
            <span className="ml-1.5 font-normal normal-case tracking-normal text-slate-400">
              &mdash; {col.subtitle}
            </span>
          </h2>
          <span className="shrink-0 text-[12px] text-slate-400 tabular-nums">
            {epics.length} {epics.length === 1 ? "epic" : "epics"}
            {totalWeeks > 0 && <React.Fragment> &middot; {totalWeeks}w</React.Fragment>}
          </span>
        </div>
        <CapacityReadout epics={epics} capacity={capacity} />
      </header>

      <div ref={listRef} className="flex-1 space-y-2.5 overflow-y-auto p-3">
        {renderList()}
        {visible.length === 0 && phIndex === null && (
          <div className="rounded-lg border border-dashed border-slate-200 px-4 py-10 text-center text-[13px] text-slate-300">
            Drop an epic here
          </div>
        )}
      </div>

      <div className="shrink-0 border-t border-slate-100 p-2.5">
        <button
          type="button"
          onClick={() => onAddEpic(col.id)}
          className="w-full rounded-lg border border-dashed border-slate-200 py-2 text-[13px] font-medium text-slate-400 transition-colors hover:border-accent/40 hover:bg-accent/5 hover:text-accent"
        >
          + Add epic
        </button>
      </div>
    </section>
  );
}

function Bullets({ title, items }) {
  if (!items || !items.length) return null;
  return (
    <div>
      <h4 className="text-[11px] font-semibold uppercase tracking-[0.08em] text-slate-400">
        {title}
      </h4>
      <ul className="mt-2 space-y-1.5">
        {items.map((it, i) => (
          <li key={i} className="flex gap-2 text-[13px] leading-relaxed text-slate-600">
            <span className="mt-[6px] h-1.5 w-1.5 shrink-0 rounded-full bg-slate-400" />
            <span>{it}</span>
          </li>

const INPUT_CLASS =
  "w-full rounded-md border border-slate-200 px-2.5 py-1.5 text-[13px] text-slate-800 " +
  "placeholder:text-slate-400 focus:border-accent focus:outline-none focus:ring-1 focus:ring-accent/30";

function Field({ label, hint, children }) {
  return (
    <div>
      <div className="flex items-baseline justify-between">
        <label className="text-[11px] font-semibold uppercase tracking-[0.08em] text-slate-400">
          {label}
        </label>
        {hint && <span className="text-[11px] text-slate-300">{hint}</span>}

}

function RoleCheckbox({ role, checked, onChange }) {
  return (
    <label
      className={
        "flex cursor-pointer items-center gap-1.5 rounded-md border px-2.5 py-1.5 text-[13px] font-medium transition-colors " +
        (checked
          ? "border-accent/40 bg-accent/5 text-slate-800"
          : "border-slate-200 text-slate-400 hover:border-slate-300")
      }

        type="checkbox"

      {role}

// Local, uncommitted form state — nothing reaches app state until Save.
function EpicForm({ epic, epics, byId, isNewDraft, onSave, onCancel, onDelete }) {
  const [form, setForm] = useState(() => ({
    title: epic.title || "",
    estimate: epic.estimate != null ? String(epic.estimate) : "",
    roles: epic.roles || [],
    deps: epic.deps || [],
    blockedBy: epic.blockedBy || "",
    value: epic.value || "Medium",
    confidence: epic.confidence || "Medium",
    outcome: epic.outcome || "",
    description: epic.description || "",
    scope: listToLines(epic.scope),
    outOfScope: listToLines(epic.outOfScope),
    acceptance: listToLines(epic.acceptance),
  }));
  const [confirmingDelete, setConfirmingDelete] = useState(false);

  const set = (key) => (e) => setForm((f) => ({ ...f, [key]: e.target.value }));

  const toggleRole = (role) => {
    setForm((f) => ({
      ...f,
      roles: f.roles.includes(role) ? f.roles.filter((r) => r !== role) : [...f.roles, role],
    }));
  };

  const toggleDep = (id) => {
    setForm((f) => ({
      ...f,
      deps: f.deps.includes(id) ? f.deps.filter((d) => d !== id) : [...f.deps, id],
    }));
  };

  const canSave = form.title.trim().length > 0;

  const handleSave = () => {
    if (!canSave) return;
    onSave(epic.id, {
      title: form.title.trim(),
      estimate: form.estimate.trim() === "" ? undefined : Math.max(0, Number(form.estimate) || 0),
      roles: form.roles,
      deps: form.deps,
      blockedBy: form.blockedBy.trim() || undefined,
      value: form.value,
      confidence: form.confidence,
      outcome: form.outcome.trim(),
      description: form.description.trim(),
      scope: linesToList(form.scope),
      outOfScope: linesToList(form.outOfScope),
      acceptance: linesToList(form.acceptance),
    });
  };

  const otherEpics = epics
    .filter((e) => e.id !== epic.id)
    .slice()
    .sort((a, b) => (parseInt(a.id.slice(1), 10) || 0) - (parseInt(b.id.slice(1), 10) || 0));

  const dependents = dependentsOf(epics, epic.id);

  return (
    <React.Fragment>
      <div className="flex-1 space-y-5 overflow-y-auto px-5 py-5">
        <Field label="Title">
          <input
            type="text"
            value={form.title}
            onChange={set("title")}
            placeholder="Epic title"
            autoFocus
            className={INPUT_CLASS}
          />
          {!canSave && (
            <p className="mt-1 text-[11.5px] text-red-500">Title is required.</p>
          )}
        </Field>

        <Field label="Estimate" hint="weeks">
          <input
            type="number"
            min="0"
            value={form.estimate}
            onChange={set("estimate")}
            placeholder="Leave blank if not estimated"
            className={INPUT_CLASS}
          />
        </Field>

        <div className="grid grid-cols-2 gap-3">
          <Field label="Value">
            <select value={form.value} onChange={set("value")} className={INPUT_CLASS}>
              {CONFIDENCE_VALUE_OPTIONS.map((v) => (
                <option key={v} value={v}>{v}</option>
              ))}
            </select>
          </Field>
          <Field label="Confidence">
            <select value={form.confidence} onChange={set("confidence")} className={INPUT_CLASS}>
              {CONFIDENCE_VALUE_OPTIONS.map((v) => (
                <option key={v} value={v}>{v}</option>
              ))}
            </select>
          </Field>
        </div>

        <Field label="Roles">
          <div className="flex flex-wrap gap-1.5">
            {ROLES.map((r) => (
              <RoleCheckbox
                key={r}
                role={r}
                checked={form.roles.includes(r)}
                onChange={() => toggleRole(r)}
              />
            ))}
          </div>
        </Field>

        <Field label="Dependencies">
          {otherEpics.length === 0 ? (
            <p className="text-[12.5px] text-slate-400">No other epics yet.</p>
          ) : (
            <div className="max-h-36 space-y-0.5 overflow-y-auto rounded-md border border-slate-200 p-1.5">
              {otherEpics.map((e) => {
                // e already (transitively) depends on this epic — adding it
                // back as a dependency would close a loop.
                const cycle = wouldCreateCycle(byId, epic.id, e.id);
                return (
                  <label
                    key={e.id}
                    className={
                      "flex items-center gap-2 rounded px-1.5 py-1 text-[12.5px] " +
                      (cycle
                        ? "cursor-not-allowed text-slate-300"
                        : "cursor-pointer text-slate-600 hover:bg-slate-50")
                    }
                  >
                    <input
                      type="checkbox"
                      checked={form.deps.includes(e.id)}
                      disabled={cycle}
                      onChange={() => toggleDep(e.id)}
                      className="h-3.5 w-3.5 shrink-0 rounded border-slate-300 text-accent focus:ring-accent disabled:cursor-not-allowed"
                    />
                    <span className={"shrink-0 font-mono text-[11px] " + (cycle ? "text-slate-300" : "text-slate-400")}>
                      {e.id}
                    </span>
                    <span className="truncate">{e.title || "Untitled epic"}</span>
                    {cycle && (
                      <span className="ml-auto shrink-0 pl-2 text-[10.5px] italic text-slate-400">
                        would create a cycle
                      </span>
                    )}
                  </label>
                );
              })}
            </div>
          )}
        </Field>

        <Field label="Blocked by" hint="optional">
          <input
            type="text"
            value={form.blockedBy}
            onChange={set("blockedBy")}
            placeholder="e.g. Utility data partnership not signed"
            className={INPUT_CLASS}
          />
        </Field>

        <Field label="Outcome" hint="what this delivers to residents or council">
          <input
            type="text"
            value={form.outcome}
            onChange={set("outcome")}
            placeholder="e.g. Residents can check their own flood risk"
            className={INPUT_CLASS}
          />
        </Field>

        <Field label="Description">
          <textarea
            rows={3}
            value={form.description}
            onChange={set("description")}
            className={INPUT_CLASS + " resize-none"}
          />
        </Field>

        <Field label="Scope" hint="one item per line">
          <textarea
            rows={3}
            value={form.scope}
            onChange={set("scope")}
            className={INPUT_CLASS + " resize-none"}
          />
        </Field>

        <Field label="Out of scope" hint="one item per line">
          <textarea
            rows={3}
            value={form.outOfScope}
            onChange={set("outOfScope")}
            className={INPUT_CLASS + " resize-none"}
          />
        </Field>

        <Field label="Acceptance criteria" hint="one item per line">
          <textarea
            rows={3}
            value={form.acceptance}
            onChange={set("acceptance")}
            className={INPUT_CLASS + " resize-none"}
          />
        </Field>

        {!isNewDraft && (
          <div className="border-t border-slate-100 pt-4">
            {!confirmingDelete ? (
              <button
                type="button"
                onClick={() => setConfirmingDelete(true)}
                className="text-[12.5px] font-medium text-red-600 hover:text-red-700"
              >
                Delete epic
              </button>
            ) : (
              <div className="rounded-md border border-red-200 bg-red-50 p-3">
                {dependents.length > 0 ? (
                  <React.Fragment>
                    <p className="text-[12.5px] leading-relaxed text-red-800">
                      Delete {epic.id}{epic.title ? " “" + epic.title + "”" : ""}? This can't be undone.
                    </p>
                    <p className="mt-1.5 text-[12.5px] leading-relaxed text-red-800">
                      {dependents
                        .map((d) => d.id + (d.title ? " “" + d.title + "”" : ""))
                        .join(", ")}{" "}
                      depend on this. Those links will be removed.
                    </p>
                  </React.Fragment>
                ) : (
                  <p className="text-[12.5px] leading-relaxed text-red-800">
                    Delete {epic.id}{epic.title ? " “" + epic.title + "”" : ""}? It will
                    also be removed from any other epic's dependency list. This can't be undone.
                  </p>
                )}
                <div className="mt-2.5 flex gap-2">
                  <button
                    type="button"
                    onClick={() => onDelete(epic.id)}
                    className="rounded-md bg-red-600 px-3 py-1.5 text-[12.5px] font-medium text-white hover:bg-red-700"
                  >
                    Delete permanently
                  </button>
                  <button
                    type="button"
                    onClick={() => setConfirmingDelete(false)}
                    className="rounded-md border border-slate-200 px-3 py-1.5 text-[12.5px] font-medium text-slate-600 hover:bg-slate-50"
                  >
                    Cancel
                  </button>
                </div>
              </div>
            )}
          </div>
        )}
      </div>

      <div className="flex shrink-0 items-center justify-end gap-2 border-t border-slate-100 px-5 py-4">
        <button
          type="button"
          onClick={onCancel}
          className="rounded-md border border-slate-200 px-3.5 py-2 text-[13px] font-medium text-slate-600 transition-colors hover:bg-slate-50"
        >
          Cancel
        </button>
        <button
          type="button"
          onClick={handleSave}
          disabled={!canSave}
          className={
            "rounded-md px-3.5 py-2 text-[13px] font-medium text-white transition-colors " +
            (canSave ? "bg-accent hover:bg-[#088850]" : "cursor-not-allowed bg-slate-300")
          }
        >
          Save
        </button>
      </div>
    </React.Fragment>
  );
}

// A thin invisible strip straddling the panel's left edge. Dragging it left
// (away from the panel's anchored right edge) grows the panel.
function ResizeHandle({ width, onResize }) {
  const dragState = useRef({ startX: 0, startWidth: 0 });

  const onMouseDown = (e) => {
    e.preventDefault();
    dragState.current = { startX: e.clientX, startWidth: width };
    document.body.style.cursor = "col-resize";
    document.body.style.userSelect = "none";

    const onMouseMove = (ev) => {
      const { startX, startWidth } = dragState.current;
      const dx = startX - ev.clientX;
      const max = window.innerWidth * MAX_PANEL_WIDTH_RATIO;
      onResize(Math.min(Math.max(startWidth + dx, MIN_PANEL_WIDTH), max));
    };
    const onMouseUp = () => {
      document.body.style.cursor = "";
      document.body.style.userSelect = "";
      window.removeEventListener("mousemove", onMouseMove);
      window.removeEventListener("mouseup", onMouseUp);
    };
    window.addEventListener("mousemove", onMouseMove);
    window.addEventListener("mouseup", onMouseUp);
  };

  return (
    <div
      onMouseDown={onMouseDown}
      role="separator"
      aria-orientation="vertical"
      aria-label="Resize panel"
      className="group absolute -left-1 top-0 z-10 h-full w-2 cursor-col-resize select-none"
    >
      <div className="mx-auto h-full w-px bg-transparent group-hover:bg-accent/50" />
    </div>
  );
}

function DetailPanel({ epic, epics, capacity, byId, editing, isNewDraft, width, onResize, onClose, onEdit, onCancelEdit, onSave, onDelete }) {
  // While editing, the backdrop/X/Esc should behave like Cancel — otherwise a
  // stray click discards an in-progress edit with no warning.
  const dismiss = editing ? onCancelEdit : onClose;

  useEffect(() => {
    const onKey = (e) => { if (e.key === "Escape") dismiss(); };
    window.addEventListener("keydown", onKey);
    return () => window.removeEventListener("keydown", onKey);
  }, [dismiss]);

  if (!epic) return null;

  const missing = missingRolesFor(epic, capacity);
  const blocked = blockingDepsFor(epic, byId);

  // Re-clamped on every render, not just on drag — guards against a stored
  // width becoming stale if the browser window is resized while open.
  const clampedWidth = Math.min(
    Math.max(width, MIN_PANEL_WIDTH),
    window.innerWidth * MAX_PANEL_WIDTH_RATIO
  );

  return (
    <React.Fragment>
      <div
        onClick={dismiss}
        className="fixed inset-0 z-30 bg-slate-900/10"
      />
      <aside
        className="fixed right-0 top-0 z-40 flex h-full flex-col border-l border-slate-200 bg-white shadow-[-8px_0_24px_rgba(16,24,40,0.06)]"
        style={{ width: clampedWidth }}
      >
        <ResizeHandle width={clampedWidth} onResize={onResize} />
        <header className="flex items-start justify-between gap-3 border-b border-slate-100 px-5 py-4">
          <div>
            <div className="flex items-center gap-2">
              <span className="rounded bg-slate-50 px-1.5 py-0.5 font-mono text-[11px] text-slate-500">
                {epic.id}
              </span>
              <span className="text-[11px] uppercase tracking-[0.08em] text-slate-400">
                {COLUMN_LABEL[epic.column]}
              </span>
            </div>
            <h2
              className={
                "mt-1.5 text-[17px] font-medium leading-snug " +
                (epic.title ? "text-slate-900" : "italic text-slate-400")
              }
            >
              {editing
                ? (isNewDraft ? "New epic" : "Editing " + epic.id)
                : (epic.title || "Untitled epic")}
            </h2>
          </div>
          <div className="flex shrink-0 items-center gap-1">
            {!editing && (
              <button
                type="button"
                onClick={onEdit}
                className="rounded px-2 py-1.5 text-[12px] font-medium text-slate-500 transition-colors hover:bg-slate-50 hover:text-slate-800"
              >
                Edit
              </button>
            )}
            <button
              type="button"
              onClick={dismiss}
              aria-label="Close panel"
              className="-mr-1 shrink-0 rounded p-1.5 text-slate-400 transition-colors hover:bg-slate-50 hover:text-slate-700"
            >
              <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" strokeWidth="1.5">
                <path d="M4 4l8 8M12 4l-8 8" strokeLinecap="round" />
              </svg>
            </button>
          </div>
        </header>

        {editing ? (
          <EpicForm
            epic={epic}
            epics={epics}
            byId={byId}
            isNewDraft={isNewDraft}
            onSave={onSave}
            onCancel={onCancelEdit}
            onDelete={onDelete}
          />
        ) : (
          <div className="flex-1 space-y-6 overflow-y-auto px-5 py-5">
            {(missing.length > 0 || blocked.length > 0) && (
              <div className="space-y-2">
                {missing.length > 0 && (
                  <div className="rounded-md border border-red-200 bg-red-50 px-3 py-2 text-[12.5px] text-red-800">
                    Unstaffed &mdash; no {missing.join(", ")} available.
                  </div>
                )}
                {blocked.map((dep) => (
                  <div
                    key={dep.id}
                    className="rounded-md border border-amber-200 bg-amber-50 px-3 py-2 text-[12.5px] text-amber-900"
                  >
                    Depends on {dep.id} &ldquo;{dep.title}&rdquo;, which sits in{" "}
                    {COLUMN_LABEL[dep.column]}.
                  </div>
                ))}
              </div>
            )}

            <div className="grid grid-cols-2 gap-x-4 gap-y-4 border-b border-slate-100 pb-5">
              <div>
                <h4 className="text-[11px] font-semibold uppercase tracking-[0.08em] text-slate-400">
                  Estimate
                </h4>
                <p className="mt-1.5 text-[13px] text-slate-700">
                  {epic.estimate != null ? epic.estimate + " weeks" : "Not estimated"}
                </p>
              </div>
              <div>
                <h4 className="text-[11px] font-semibold uppercase tracking-[0.08em] text-slate-400">
                  Dependencies
                </h4>
                <p className="mt-1.5 font-mono text-[12px] text-slate-700">
                  {epic.deps.length ? epic.deps.join(", ") : "—"}
                </p>
              </div>
              {epic.blockedBy && (
                <div className="col-span-2">
                  <h4 className="text-[11px] font-semibold uppercase tracking-[0.08em] text-slate-400">
                    Blocked by
                  </h4>
                  <p className="mt-1.5 text-[13px] text-slate-700">
                    {epic.blockedBy}
                  </p>
                </div>
              )}
              <div className="col-span-2">
                <h4 className="text-[11px] font-semibold uppercase tracking-[0.08em] text-slate-400">
                  Roles
                </h4>
                <div className="mt-2 flex flex-wrap gap-1.5">
                  {epic.roles.length
                    ? epic.roles.map((r) => (
                        <RoleTag key={r} role={r} muted={missing.includes(r)} />
                      ))
                    : <span className="text-[12.5px] text-slate-400">None assigned</span>}
                </div>
              </div>
            </div>

            <div>
              <h4 className="text-[11px] font-semibold uppercase tracking-[0.08em] text-slate-400">
                Outcome
              </h4>
              <p className="mt-2 text-[13px] leading-relaxed text-slate-600">
                {epic.outcome || (
                  <span className="text-slate-400">Not set yet.</span>
                )}
              </p>
            </div>

            <div>
              <h4 className="text-[11px] font-semibold uppercase tracking-[0.08em] text-slate-400">
                Description
              </h4>
              <p className="mt-2 text-[13px] leading-relaxed text-slate-600">
                {epic.description || (
                  <span className="text-slate-400">No description yet.</span>
                )}
              </p>
            </div>

            <Bullets title="Scope" items={epic.scope} />
            <Bullets title="Out of scope" items={epic.outOfScope} />
            <Bullets title="Acceptance criteria" items={epic.acceptance} />
          </div>
        )}
      </aside>
    </React.Fragment>
  );
}

/* ------------------------------------------------------------------ */
/* App                                                                 */
/* ------------------------------------------------------------------ */

function App() {
  const [epics, setEpics] = useState(INITIAL_EPICS);
  const [enabled, setEnabled] = useState({ FS: true, Data: true, AI: true, Design: true });
  const [openId, setOpenId] = useState(null);
  const [editing, setEditing] = useState(false);
  // True only for an epic created via "+ Add epic" that hasn't been saved
  // yet — Cancel discards it instead of leaving an empty draft behind.
  const [isNewDraft, setIsNewDraft] = useState(false);
  // drag: { id, height, lifted } — `lifted` flips a tick after dragstart, once
  // the browser has snapshotted its drag image, so pulling the card out of the
  // flow can't cancel the drag.
  const [drag, setDrag] = useState(null);
  const [dropAt, setDropAt] = useState(null);
  // Lives at the App level (not per-epic) so it holds steady across opening
  // different cards, for as long as the app stays open.
  const [panelWidth, setPanelWidth] = useState(DEFAULT_PANEL_WIDTH);
  // Which health indicator (if any) is filtering the board — 'staffing',
  // 'sequencing', 'prioritization', or null.
  const [activeFilter, setActiveFilter] = useState(null);

  const toggleFilter = useCallback((id) => {
    setActiveFilter((prev) => (prev === id ? null : id));
  }, []);

  useEffect(() => {
    if (!activeFilter) return;
    const onKey = (e) => { if (e.key === "Escape") setActiveFilter(null); };
    window.addEventListener("keydown", onKey);
    return () => window.removeEventListener("keydown", onKey);
  }, [activeFilter]);

  const capacity = useMemo(() => {
    const c = {};
    ROLES.forEach((r) => { c[r] = enabled[r] ? DEFAULT_CAPACITY[r] : 0; });
    return c;
  }, [enabled]);

  const byId = useMemo(() => {
    const m = {};
    epics.forEach((e) => { m[e.id] = e; });
    return m;
  }, [epics]);

  /* ---- FLIP: cards glide to their new slots instead of jumping ---- */

  const cardNodes = useRef(new Map());
  const snapshot = useRef(null);
  const dropAtRef = useRef(null);
  const landing = useRef(null);

  const registerNode = useCallback((id, node) => {
    if (node) cardNodes.current.set(id, node);
    else cardNodes.current.delete(id);
  }, []);

  // "First": record where every card sits *before* the state change that will
  // move it. Callers invoke this from the event handler, ahead of setState.
  const captureLayout = useCallback((duration) => {
    const rects = new Map();
    cardNodes.current.forEach((node, id) => {
      const r = node.getBoundingClientRect();
      // A lifted card is display:none and measures as all zeroes — no origin
      // to animate from, so leave it out.
      if (r.width || r.height) rects.set(id, r);
    });
    const columns = new Map();
    epics.forEach((e) => columns.set(e.id, e.column));
    snapshot.current = { rects, columns, duration: duration || REFLOW_MS };
  }, [epics]);

  // "Last / Invert / Play": runs before paint, so the inverted transform is
  // applied in the same frame the browser would otherwise show the jump.
  // No dep array — any render may follow a capture (drop, or a role toggle
  // that grows a card with a warning badge and pushes its neighbours down).
  useLayoutEffect(() => {
    const snap = snapshot.current;
    if (!snap) return;
    snapshot.current = null;

    if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;

    const landed = landing.current;
    landing.current = null;

    epics.forEach((epic) => {
      const node = cardNodes.current.get(epic.id);
      if (!node) return;

      // Replace any in-flight move so rapid hovers don't stack transforms.
      if (node.__flip) node.__flip.cancel();

      const prev = snap.rects.get(epic.id);

      // The card that just landed is newly mounted, so there is no previous
      // rect to invert from — it takes over the grey slot's exact geometry.
      // Fade it in so the swap isn't an abrupt grey-to-white flick.
      if (!prev) {
        if (epic.id === landed) {
          node.__flip = node.animate(
            [
              { opacity: 0, transform: "scale(0.985)" },
              { opacity: 1, transform: "none" },
            ],
            { duration: SETTLE_MS, easing: EASE }
          );
        }
        return;
      }

      const next = node.getBoundingClientRect();
      if (!next.width && !next.height) return;   // just lifted out of layout
      const dx = prev.left - next.left;
      const dy = prev.top - next.top;
      if (Math.abs(dx) < 1 && Math.abs(dy) < 1) return;

      // A card that changed column re-parents into a different scrolling
      // container, so a FLIP translate across that gap would be clipped by the
      // destination's overflow box. Settle it into place instead.
      if (snap.columns.get(epic.id) !== epic.column) {
        node.__flip = node.animate(
          [
            { opacity: 0, transform: "scale(0.98) translateY(-4px)" },
            { opacity: 1, transform: "none" },
          ],
          { duration: SETTLE_MS, easing: EASE }
        );
        return;
      }

      node.__flip = node.animate(
        [
          { transform: "translate(" + dx + "px, " + dy + "px)" },
          { transform: "translate(0px, 0px)" },
        ],
        { duration: snap.duration, easing: EASE }
      );
    });
  });

  /* ---- Drag / drop ---- */

  // Mirrored in a ref so dragover — which fires continuously — can compare
  // against the live value without re-creating the handler on every move.
  const setDropTarget = useCallback((next) => {
    dropAtRef.current = next;
    setDropAt(next);
  }, []);

  const handleDragStart = useCallback((e, id) => {
    const height = e.currentTarget.getBoundingClientRect().height;
    e.dataTransfer.effectAllowed = "move";
    e.dataTransfer.setData("text/plain", id);
    setDrag({ id, height, lifted: false });

    // The card's own slot, before it's lifted — seeding the placeholder here
    // (rather than waiting for the first dragover) means the hide-and-slot
    // swap below is a single same-height commit. Without this, a column
    // scrolled to its bottom edge briefly loses that card's height with no
    // placeholder backfilling it, so the browser clamps scrollTop to the
    // now-shorter content and the list jumps out from under the cursor —
    // a jump that sticks until the user manually scrolls back up.
    const epic = epics.find((x) => x.id === id);
    const originAt = epic
      ? { column: epic.column, index: epics.filter((x) => x.column === epic.column).findIndex((x) => x.id === id) }
      : null;

    // Deferred: pulling the source out of the flow during the dragstart
    // handler aborts the drag in Chrome. One tick is enough. setDrag and
    // setDropTarget below land in the same React commit (React 18 batches
    // updates inside a timeout), so there is no intermediate frame where
    // the card is hidden but the slot hasn't appeared yet.
    setTimeout(() => {
      captureLayout(SHIFT_MS);
      setDrag((d) => (d && d.id === id ? { ...d, lifted: true } : d));
      if (originAt) setDropTarget(originAt);
    }, 0);
  }, [captureLayout, epics, setDropTarget]);

  const handleHover = useCallback((columnId, index) => {
    const prev = dropAtRef.current;
    if (prev && prev.column === columnId && prev.index === index) return;
    captureLayout(SHIFT_MS);
    setDropTarget({ column: columnId, index });
  }, [captureLayout, setDropTarget]);

  const handleLeave = useCallback((columnId) => {
    const prev = dropAtRef.current;
    if (!prev || prev.column !== columnId) return;
    captureLayout(SHIFT_MS);
    setDropTarget(null);
  }, [captureLayout, setDropTarget]);

  const handleDragEnd = useCallback(() => {
    captureLayout(SHIFT_MS);
    setDrag(null);
    setDropTarget(null);
  }, [captureLayout, setDropTarget]);

  const handleDrop = useCallback((columnId, index) => {
    if (!drag) return;
    captureLayout();
    landing.current = drag.id;
    setEpics((prev) => moveEpic(prev, drag.id, columnId, index));
    setDrag(null);
    setDropTarget(null);
  }, [drag, captureLayout, setDropTarget]);

  const toggleRole = useCallback((role, on) => {
    captureLayout();
    setEnabled((p) => ({ ...p, [role]: on }));
  }, [captureLayout]);

  /* ---- Epic panel: open / edit / save / delete / create ---- */

  const openEpicPanel = useCallback((id) => {
    setOpenId(id);
    setEditing(false);
    setIsNewDraft(false);
  }, []);

  // Bring the selected card into view when the panel opens — either because
  // its column is scrolled elsewhere, or because it would sit physically
  // underneath the panel now covering the right edge of the board.
  useEffect(() => {
    if (!openId) return;
    const node = cardNodes.current.get(openId);
    if (!node) return;

    const rect = node.getBoundingClientRect();
    const coveredByPanel = rect.right > window.innerWidth - panelWidth;

    const list = node.closest(".overflow-y-auto");
    const outOfView = list
      ? (() => {
          const lr = list.getBoundingClientRect();
          return rect.top < lr.top || rect.bottom > lr.bottom;
        })()
      : false;

    if (coveredByPanel || outOfView) {
      node.scrollIntoView({ behavior: "smooth", block: "center" });
    }
    // Only re-check when a *different* card opens — re-running this while
    // the user is mid-resize would fight their drag.
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [openId]);

  const closeEpicPanel = useCallback(() => {
    setOpenId(null);
    setEditing(false);
    setIsNewDraft(false);
  }, []);

  const startEdit = useCallback(() => setEditing(true), []);

  const cancelEdit = useCallback(() => {
    if (isNewDraft) {
      // Never-saved draft — discard it rather than leave an empty card.
      captureLayout();
      setEpics((prev) => prev.filter((e) => e.id !== openId));
      setOpenId(null);
    }
    setEditing(false);
    setIsNewDraft(false);
  }, [isNewDraft, openId, captureLayout]);

  const saveEpic = useCallback((id, fields) => {
    captureLayout();
    setEpics((prev) => prev.map((e) => (e.id === id ? { ...e, ...fields } : e)));
    setEditing(false);
    setIsNewDraft(false);
  }, [captureLayout]);

  const deleteEpic = useCallback((id) => {
    captureLayout();
    setEpics((prev) =>
      prev
        .filter((e) => e.id !== id)
        .map((e) => (e.deps.includes(id) ? { ...e, deps: e.deps.filter((d) => d !== id) } : e))
    );
    setOpenId(null);
    setEditing(false);
    setIsNewDraft(false);
  }, [captureLayout]);

  const addEpic = useCallback((columnId) => {
    captureLayout();
    const id = nextEpicId(epics);
    const draft = {
      id,
      title: "",
      column: columnId,
      estimate: undefined,
      roles: [],
      deps: [],
      blockedBy: undefined,
      value: "Medium",
      confidence: "Medium",
      outcome: "",
      description: "",
      scope: [],
      outOfScope: [],
      acceptance: [],
    };
    setEpics((prev) => [...prev, draft]);
    setOpenId(id);
    setEditing(true);
    setIsNewDraft(true);
  }, [captureLayout, epics]);

  // Three header health indicators — recomputed from live state, so drag,
  // toggle, edit, add and delete all reflect immediately.
  const health = useMemo(() => {
    const staffingEpics = epics.filter((e) => missingRolesFor(e, capacity).length > 0);
    const sequencingEpics = epics.filter((e) => blockingDepsFor(e, byId).length > 0);

    // Prioritization's count is a literal sum of three checks — an epic that
    // trips two of them (e.g. Now + Low value + Low confidence) counts
    // twice, even though it only highlights once on the board.
    const nowLowConfidence = epics.filter((e) => e.column === "now" && e.confidence === "Low");
    const nowLowValue = epics.filter((e) => e.column === "now" && e.value === "Low");
    const laterHighValue = epics.filter((e) => e.column === "later" && e.value === "High");
    const prioritizationCount = nowLowConfidence.length + nowLowValue.length + laterHighValue.length;
    const prioritizationIds = new Set(
      [...nowLowConfidence, ...nowLowValue, ...laterHighValue].map((e) => e.id)
    );

    return {
      staffing: { count: staffingEpics.length, ids: new Set(staffingEpics.map((e) => e.id)) },
      sequencing: { count: sequencingEpics.length, ids: new Set(sequencingEpics.map((e) => e.id)) },
      prioritization: { count: prioritizationCount, ids: prioritizationIds },
    };
  }, [epics, capacity, byId]);

  const activeCategory = activeFilter ? HEALTH_CATEGORIES.find((c) => c.id === activeFilter) : null;
  const filter = activeCategory
    ? { ids: health[activeCategory.id].ids, ringClass: activeCategory.cardRing }
    : null;

  const openEpic = openId ? byId[openId] : null;

  return (
    <div className="flex h-full flex-col bg-white text-slate-900">
      {/* Header */}
      <header className="shrink-0 border-b border-slate-200 bg-white">
        <div className="flex flex-wrap items-center justify-between gap-4 px-6 py-4">
          <div className="flex items-baseline gap-3">
            <h1 className="text-[17px] font-semibold tracking-tight">Lumeria Climate Platform — Roadmap</h1>
            <span className="text-[13px] text-slate-400">
              {epics.length} epics &middot;{" "}
              {epics
                .filter((e) => e.column === "now" || e.column === "next")
                .reduce((s, e) => s + (e.estimate || 0), 0)}{" "}
              weeks in Now + Next
            </span>
          </div>

          <div className="flex flex-wrap items-center gap-2">
            <span className="mr-1 text-[12px] uppercase tracking-[0.08em] text-slate-400">
              Team
            </span>
            {ROLES.map((r) => (
              <Toggle
                key={r}
                role={r}
                count={DEFAULT_CAPACITY[r]}
                on={enabled[r]}
                onChange={(v) => toggleRole(r, v)}
              />
            ))}
            <span className="ml-2 flex items-center gap-1.5 text-[11px] text-slate-400">
              <span className="inline-block h-0 w-4 border-t border-dashed border-slate-400" />
              dashed border = low confidence
            </span>
          </div>
        </div>

        {/* Health indicators */}
        <div className="flex flex-wrap items-center gap-1 px-6 pb-3">
          {HEALTH_CATEGORIES.map((cat) => (
            <React.Fragment key={cat.id}>
              <HealthIndicator
                category={cat}
                count={health[cat.id].count}
                active={activeFilter === cat.id}
                onClick={toggleFilter}
              />
              {cat.id !== "prioritization" && (
                <span className="text-slate-300">&middot;</span>
              )}
            </React.Fragment>
          ))}
        </div>
      </header>

      {/* Board */}
      <main className="min-h-0 flex-1 bg-[#FCFCFC] px-6 py-6">
        <div className="grid h-full min-h-0 grid-cols-1 gap-5 md:grid-cols-3">
          {COLUMNS.map((col) => (
            <Column
              key={col.id}
              col={col}
              epics={epics.filter((e) => e.column === col.id)}
              capacity={capacity}
              byId={byId}
              onOpen={openEpicPanel}
              onAddEpic={addEpic}
              openId={openId}
              filter={filter}
              registerNode={registerNode}
              drag={drag}
              dropAt={dropAt}
              onHover={handleHover}
              onLeave={handleLeave}
              onDrop={handleDrop}
              onDragStart={handleDragStart}
              onDragEnd={handleDragEnd}
            />
          ))}
        </div>
      </main>

      <DetailPanel
        epic={openEpic}
        epics={epics}
        capacity={capacity}
        byId={byId}
        editing={editing}
        isNewDraft={isNewDraft}
        width={panelWidth}
        onResize={setPanelWidth}
        onClose={closeEpicPanel}
        onEdit={startEdit}
        onCancelEdit={cancelEdit}
        onSave={saveEpic}
        onDelete={deleteEpic}
      />
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
